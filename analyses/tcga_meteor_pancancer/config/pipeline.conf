# Pipeline settings (sourced by the SLURM scripts). Edit the paths and the SLURM account/partition for your cluster.

# where the pipeline folder lives on the cluster, and where per-cohort data/results go (one sub-folder per cohort)
PIPE_DIR=${PIPE_DIR:-/beegfs/scratch/ieo7293/tcga_meteor_pancancer}   # set automatically by submit_cohort.sh
WORK_DIR=${WORK_DIR:-/beegfs/scratch/ieo7293/tcga_meteor_runs}

# conda: either the name of an existing env or the path of one created from env/meteor_tcga.yml
CONDA_ENV=meteor_tcga

# SLURM: leave any of these empty to use the cluster default (no --partition / --account / --qos is passed)
SLURM_PARTITION=
SLURM_ACCOUNT=
SLURM_QOS=

# cohorts are modelled only with >= MIN_SAMPLES samples having both 450K methylation and expression
MIN_SAMPLES=100

# preprocessing job (download + REMP imputation + export): one per cohort
PREP_CPUS=8
PREP_MEM=128G
PREP_TIME=24:00:00

# gene jobs: a job array; each task runs GENES_PER_TASK genes, PAR_PER_TASK at a time, N_JOBS cores per model
GENES_PER_TASK=100
PAR_PER_TASK=8
N_JOBS=2
TASK_MEM=48G
TASK_TIME=24:00:00
MAX_CONCURRENT_TASKS=20      # array throttle (%N)

# methylation values used as model features: beta (default) or M (as the original TCGA PRAD run)
METH_SCALE=${METH_SCALE:-beta}

# model settings: same as the prostate WGBS runs (SVR, RepeatedKFold 3x5, k capped at the per-fold n, 27 iterations)
WINDOW_BP=1000000            # +-1 Mb around the TSS
TEST_SIZE=0.3                # 70/30 train/test split, fixed seed (as TCGA PRAD)
CV=3
N_REPEATS=5
N_ITER=27
KEEP_GENE_DATASETS=0         # 1 = keep the per-gene train/test tables (about 1-3 GB per cohort)

# ---- stability selection (submit_stability.sh): same procedure as the prostate WGBS analysis ----
STAB_N_PAIRS=100             # complementary pairs of half-samples (200 halves), stratified tumour / normal
STAB_PFER=1                  # stabs bound: expected false features per gene. With ~400 probes and k ~100 the cutoff
                             # for PFER <= 1 is ~1.0; frequencies are kept, so only the summary job is rerun to change it
STAB_CORR=0.5                # co-methylated regions: adjacent r >= STAB_CORR and <= STAB_MAX_GAP bp apart
STAB_MAX_GAP=300
STAB_R_ENV=meteor_stability  # conda env (name or path) from env/meteor_stability.yml: R + stabm + stabs + data.table
STAB_CPUS=2                  # selection tasks: one per gene chunk (the chunks of the gene array)
STAB_MEM=48G                 # rebuilding a chunk's tables reads the cohort methylation matrix (as the gene tasks)
STAB_TIME=08:00:00
STAB_MAX_CONCURRENT=20
STAB_SUM_CPUS=8              # summary job per cohort (R + report)
STAB_SUM_MEM=32G
STAB_SUM_TIME=06:00:00
