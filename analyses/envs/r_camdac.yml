  - conda-forge
  - bioconda
  - defaults
dependencies:
  - r-base=4.3
  - r-r.utils
  - r-readxl
  - r-data.table
  - r-remotes
  - r-devtools
  - r-optparse
  - r-logger
  - r-stringr
  - r-scales
  - r-ggplot2
  - r-gridextra
  - r-gtable
  - r-readr
  - r-dplyr
  - r-doparallel
  - r-fst
  - r-fs
  - r-png
