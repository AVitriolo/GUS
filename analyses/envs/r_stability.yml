name: r_stability
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  - r-base=4.3
  - r-stabm        # Nogueira et al. (2018) stability index (stabilityNogueira)
  - r-stabs        # stability selection error bounds (stabsel_parameters)
  - r-data.table
  - r-reticulate
  - r-rcppcnpy
  - bioconductor-bumphunter   # clusterMaker: distance-based CpG regions
  - r-susier                  # SuSiE fine-mapping (selector benchmark)
  - bioconductor-rhdf5
  - r-boruta                  # all-relevant selection (selector benchmark)
  - r-ranger
  - r-rfast                   # faster SuSiE credible-set purity
